# Directories the units REQUIRE before they can start, recreated at every boot.
#
# This file exists because of a failure that looked like a broken binary.
# `StandardOutput=append:.../logs/master_live.log` is opened by PID 1 BEFORE
# the process is spawned, and systemd does not create the parent. With `logs/`
# missing the journal said:
#
#   Failed at step STDOUT spawning .../python3: No such file or directory
#
# — which names the interpreter, not the directory, and sends you looking at a
# venv that was fine all along. `ReadWritePaths=` on a missing path fails the
# same way, one step earlier, during mount namespace setup.
#
# `logs/` is *.log-ignored in git and `.cache/` is ignored outright, so neither
# survives a fresh clone. A tmpfiles fragment is what makes their existence a
# property of the box rather than of whoever last ran the install by hand.
#
# INSTALL
#   sudo cp deploy/systemd/trading-dirs.conf /etc/tmpfiles.d/
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/trading-dirs.conf
#
#Type Path                                     Mode UID      GID      Age Arg
d     /home/cgrullon/src/trading/logs          0755 cgrullon cgrullon -   -
d     /home/cgrullon/src/trading/data          0775 cgrullon cgrullon -   -
d     /home/cgrullon/src/trading/.cache        0755 cgrullon cgrullon -   -
d     /home/cgrullon/src/trading/.cache/numba  0755 cgrullon cgrullon -   -
